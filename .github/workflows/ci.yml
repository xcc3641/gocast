name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15 # Apple silicon
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # mygo evaluates mygo.config.ts with Node.js 22.6 or later.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: gofmt
        run: |
          unformatted="$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Install the mygo CLI (the version go.mod pins)
        run: go install "github.com/egoist/mygo/cmd/mygo@$(go list -m -f '{{.Version}}' github.com/egoist/mygo)"

      - name: mygo vet
        run: mygo vet

      - name: go test
        run: go test ./...

      - name: THIRD_PARTY_NOTICES.md is up to date
        run: go run scripts/gen-third-party-notices.go -check
